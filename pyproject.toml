[project]
name = "pj"
version = "0.2.4"
description = "Thin pulumi wrapper: per-environment state backends and credentials preflight"
license = "MIT"
requires-python = ">=3.14"

dependencies = [
    "botocore",
]

[project.scripts]
pj = "pj.tools.pj:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["uv_build >= 0.10.0"]
build-backend = "uv_build"
